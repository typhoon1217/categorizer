[package]
name = "categorizer"
version = "1.0.0"
edition = "2021"
description = "Fast manual file categorizer with image preview"

[[bin]]
name = "categorizer"
path = "src/main.rs"

[dependencies]
dirs = "5"
eframe = "0.28"
egui = { version = "0.28", features = ["serde"] }
egui_extras = { version = "0.28", features = ["image", "svg"] }
font-kit = "0.14.3"
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "bmp", "webp", "tiff", "ico"
] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
lto = true
